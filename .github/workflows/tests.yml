name: QA Automation Suite

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      load_profile:
        description: Perfil do teste de carga
        type: choice
        options: [smoke, load]
        default: smoke

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: tests-api/pom.xml

      - name: Run API tests
        run: cd tests-api && ./mvnw test

      - name: Generate API report
        if: always()
        run: cd tests-api && ./mvnw allure:report

      - name: Upload API report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: api-allure-report
          path: tests-api/evidence

  mobile:
    runs-on: ubuntu-24.04
    # Consome minutos do plano BrowserStack: só em PR do próprio repo ou disparo manual; forks não recebem secrets
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    concurrency:
      group: browserstack-mobile
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tests-app/requirements.txt

      - name: Install dependencies
        run: cd tests-app && pip install -r requirements.txt

      - name: Run mobile tests
        env:
          BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
          BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
          BROWSERSTACK_APP_URL: ${{ secrets.BROWSERSTACK_APP_URL }}
        run: cd tests-app && pytest

      - name: Upload mobile report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mobile-pytest-report
          path: tests-app/evidence

  load:
    runs-on: ubuntu-24.04
    env:
      PROFILE: ${{ inputs.load_profile || 'smoke' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup k6
        uses: grafana/setup-k6-action@v1
        with:
          k6-version: 2.3.0

      - name: Run load test
        run: cd tests-load && k6 run -e PROFILE=$PROFILE load-test.js

      - name: Upload load report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: load-k6-report-${{ env.PROFILE }}
          path: tests-load/evidence/summary-${{ env.PROFILE }}.*
